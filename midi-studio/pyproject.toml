[project]
name = "midi-studio"
version = "0.1.0"
description = "Generate chord/melody/drum MIDI sketches to import into a DAW like FL Studio."
requires-python = ">=3.9"
dependencies = ["mido>=1.3.0"]

[project.scripts]
midi-studio = "midi_studio.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
