[build]
  publish = "."

# Page « Infos maillot » : lien privé partagé aux joueurs seulement (nom de
# fichier non devinable, jamais lié depuis le site). Volontairement absente de
# robots.txt et du sitemap, qui sont publics et révéleraient l'adresse.
[[headers]]
  for = "/maillots-*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    # strict-origin : envoie seulement le domaine (jamais le chemin secret de la
    # page) — FormSubmit refuse les requêtes sans en-tête Referer.
    Referrer-Policy = "strict-origin"

# /sw.js doit toujours être revérifié par le navigateur (voir sw.js).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
