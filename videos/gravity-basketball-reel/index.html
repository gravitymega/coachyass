<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Gravity Basketball — Reel</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #050505;
      }
      body {
        font-family: "Archivo Black", sans-serif;
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      .watermark {
        position: absolute;
        top: 64px;
        left: 48px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: rgba(5, 5, 5, 0.55);
        border-radius: 8px;
        opacity: 0.85;
        z-index: 50;
      }
      .watermark .dot {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        background: #ff5c00;
      }
      .watermark .word {
        font-family: "Space Mono", monospace;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.22em;
        color: #ffffff;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="28"
      data-width="1080"
      data-height="1920"
    >
      <!-- Scenes: sequential hard cuts on one visual track. -->
      <div
        id="el-hook"
        data-composition-id="hook"
        data-composition-src="compositions/01-hook.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
      ></div>
      <div
        id="el-ligue"
        data-composition-id="ligue"
        data-composition-src="compositions/02-ligue.html"
        data-start="3"
        data-duration="6"
        data-track-index="1"
      ></div>
      <div
        id="el-pickup"
        data-composition-id="pickup"
        data-composition-src="compositions/03-pickup.html"
        data-start="9"
        data-duration="6"
        data-track-index="1"
      ></div>
      <div
        id="el-communaute"
        data-composition-id="communaute"
        data-composition-src="compositions/04-communaute.html"
        data-start="15"
        data-duration="5"
        data-track-index="1"
      ></div>
      <div
        id="el-cta"
        data-composition-id="cta"
        data-composition-src="compositions/05-cta.html"
        data-start="20"
        data-duration="5"
        data-track-index="1"
      ></div>
      <div
        id="el-logo"
        data-composition-id="logo"
        data-composition-src="compositions/06-logo.html"
        data-start="25"
        data-duration="3"
        data-track-index="1"
      ></div>

      <!-- Persistent watermark bug, on top of every scene except the full-screen logo card. -->
      <div id="watermark" class="clip watermark" data-start="0" data-duration="25" data-track-index="2">
        <span class="dot"></span>
        <span class="word">Gravity Basketball</span>
      </div>

      <!-- Voiceover (French, Kokoro ff_siwis). -->
      <audio
        id="vo-hook"
        class="clip"
        src="assets/voice/hook.wav"
        data-start="0.2"
        data-duration="1.728"
        data-track-index="10"
        data-volume="1"
      ></audio>
      <audio
        id="vo-communaute"
        class="clip"
        src="assets/voice/community.wav"
        data-start="15.3"
        data-duration="2.048"
        data-track-index="10"
        data-volume="1"
      ></audio>
      <audio
        id="vo-cta"
        class="clip"
        src="assets/voice/cta.wav"
        data-start="21.3"
        data-duration="2.005"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- SFX accents on the two whip-pan scene cuts, the CTA impact, and the logo reveal. -->
      <audio
        id="sfx-whoosh-1"
        class="clip"
        src="assets/sfx/whoosh-short.mp3"
        data-start="2.75"
        data-duration="0.57"
        data-track-index="11"
        data-volume="0.4"
      ></audio>
      <audio
        id="sfx-whoosh-2"
        class="clip"
        src="assets/sfx/whoosh-short.mp3"
        data-start="8.75"
        data-duration="0.57"
        data-track-index="11"
        data-volume="0.4"
      ></audio>
      <audio
        id="sfx-impact"
        class="clip"
        src="assets/sfx/impact-bass-1.mp3"
        data-start="21.3"
        data-duration="2.12"
        data-track-index="12"
        data-volume="0.45"
      ></audio>
      <audio
        id="sfx-sparkle"
        class="clip"
        src="assets/sfx/sparkle.mp3"
        data-start="25.1"
        data-duration="1.8"
        data-track-index="13"
        data-volume="0.35"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
