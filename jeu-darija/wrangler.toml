# Le jeu de Hbibiti sur Cloudflare (Worker séparé d'Art craft : nom « jeu-hbibiti », gratuit).
# Dans Cloudflare : Workers & Pages › Create › Import a repository › gravitymega/coachyass,
# Root directory = jeu-darija, Deploy command = npx wrangler deploy (pas de build).
name = "jeu-hbibiti"
compatibility_date = "2026-10-01"
# Le worker sert le jeu et répond à /api/parler (discussion libre avec les habitants de la ville en 3D).
main = "worker/index.js"

[assets]
directory = "."
binding = "ASSETS"

# IA gratuite de Cloudflare (Workers AI, quota quotidien gratuit) pour la discussion libre.
[ai]
binding = "AI"

# Le labo du Dr Harley : progrès d'Ali partagés entre la tablette et harley-lab (KV gratuit « jeu-hbibiti-labo »).
# Le code famille est un secret : npx wrangler secret put LABO_CODE (ou Cloudflare › jeu-hbibiti › Settings › Variables and Secrets).
[[kv_namespaces]]
binding = "LABO"
id = "93c297fb4a004fc4886f188bdee32f49"

# Aucune tâche planifiée : vide les déclencheurs si une autre configuration (Art craft) a été déployée ici par erreur.
[triggers]
crons = []
