[build]
  publish = "."
  functions = "netlify/functions"

# Outil interne Gravity : jamais indexé.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Les pages appellent /api/… (mêmes adresses que sur Cloudflare Pages).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
