<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Pickups — Programme terminé</title>
<meta name="description" content="Le programme Gravity Pickups est terminé. Découvre Gravity Coaching et Gravity Basketball Montréal.">
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0A0A;--orange:#FF8A4C;--ink:#F5F0E1;--muted:#B8B2A3;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:24px 16px;text-align:center;}
  main{max-width:480px;}
  img{width:120px;height:auto;margin-bottom:16px;}
  h1{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.5px;font-size:34px;margin:0 0 12px;color:var(--orange);}
  p{line-height:1.6;color:var(--muted);margin:0 0 24px;}
  a.btn{display:block;margin:10px 0;padding:14px 18px;border-radius:12px;font-weight:700;text-decoration:none;
    border:2px solid var(--orange);color:var(--ink);}
  a.btn.primary{background:var(--orange);color:#0A0A0A;}
  a.btn:hover{opacity:.9;}
</style>
</head>
<body>
<main>
  <img src="gravity-logo.png" alt="Gravity Basketball">
  <h1>Programme terminé</h1>
  <p>Les sessions Gravity Pickups sont terminées et les réservations sont fermées. Merci à tous ceux qui sont venus jouer&nbsp;!</p>
  <a class="btn primary" href="https://coaching.osmm-mtl.site">Découvrir Gravity Coaching</a>
  <a class="btn" href="https://gravity.osmm-mtl.site">Gravity Basketball Montréal</a>
</main>
</body>
</html>
