# Open Playbook : valide les fiches, génère l'audio, construit le site et le publie sur GitHub Pages.
# Activer une fois : Settings → Pages → Source : « GitHub Actions ».
name: Open Playbook

on:
  push:
    branches: [main]
    paths: ["open-playbook/**", ".github/workflows/open-playbook.yml"]
  pull_request:
    paths: ["open-playbook/**", ".github/workflows/open-playbook.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-playbook-${{ github.ref }}
  # Ne jamais couper une publication en cours ; seules les vérifications de PR s'annulent entre elles.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: open-playbook

jobs:
  # Explication audio : Kokoro pour le français et l'anglais (16 parts chacun), termes anglais dits à l'anglaise en français.
  # Les clips sont gardés en cache : seuls les textes nouveaux ou modifiés sont régénérés.
  audio:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lang: fr, shard: 1, of: 16 }
          - { lang: fr, shard: 2, of: 16 }
          - { lang: fr, shard: 3, of: 16 }
          - { lang: fr, shard: 4, of: 16 }
          - { lang: fr, shard: 5, of: 16 }
          - { lang: fr, shard: 6, of: 16 }
          - { lang: fr, shard: 7, of: 16 }
          - { lang: fr, shard: 8, of: 16 }
          - { lang: fr, shard: 9, of: 16 }
          - { lang: fr, shard: 10, of: 16 }
          - { lang: fr, shard: 11, of: 16 }
          - { lang: fr, shard: 12, of: 16 }
          - { lang: fr, shard: 13, of: 16 }
          - { lang: fr, shard: 14, of: 16 }
          - { lang: fr, shard: 15, of: 16 }
          - { lang: fr, shard: 16, of: 16 }
          - { lang: en, shard: 1, of: 16 }
          - { lang: en, shard: 2, of: 16 }
          - { lang: en, shard: 3, of: 16 }
          - { lang: en, shard: 4, of: 16 }
          - { lang: en, shard: 5, of: 16 }
          - { lang: en, shard: 6, of: 16 }
          - { lang: en, shard: 7, of: 16 }
          - { lang: en, shard: 8, of: 16 }
          - { lang: en, shard: 9, of: 16 }
          - { lang: en, shard: 10, of: 16 }
          - { lang: en, shard: 11, of: 16 }
          - { lang: en, shard: 12, of: 16 }
          - { lang: en, shard: 13, of: 16 }
          - { lang: en, shard: 14, of: 16 }
          - { lang: en, shard: 15, of: 16 }
          - { lang: en, shard: 16, of: 16 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: open-playbook/package-lock.json
      - run: npm ci
      - run: npm run audio:jobs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install kokoro-onnx==0.6.1 soundfile && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Voix Kokoro (cache)
        uses: actions/cache@v4
        with:
          path: open-playbook/voices
          key: voices-kokoro-v1
      - name: Télécharger les voix si absentes
        run: |
          mkdir -p voices
          # Kokoro-82M (Apache 2.0), voix française et anglaise : modèle et voix publiés dans les releases de kokoro-onnx.
          for f in kokoro-v1.0.int8.onnx voices-v1.0.bin; do [ -f "voices/$f" ] || curl -fsSL -o "voices/$f" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f"; done
      - name: Clips déjà générés (cache)
        uses: actions/cache@v4
        with:
          path: open-playbook/public/audio
          key: op-audio-v4-${{ matrix.lang }}-${{ matrix.shard }}of${{ matrix.of }}-${{ hashFiles('open-playbook/audio-jobs.json') }}
          restore-keys: op-audio-v4-${{ matrix.lang }}-${{ matrix.shard }}of${{ matrix.of }}-
      - run: python3 scripts/tts.py --voices voices --lang ${{ matrix.lang }} --shard ${{ matrix.shard }}/${{ matrix.of }}
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ matrix.lang }}-${{ matrix.shard }}
          path: open-playbook/public/audio
          retention-days: 1
          if-no-files-found: ignore

  build:
    needs: audio
    # Sur une PR, l'audio n'est pas généré ; si une part audio échoue, le site est publié quand même (voix du navigateur en secours).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: open-playbook/package-lock.json
      - run: npm ci
      - run: npm run validate
      - if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: audio-*
          path: open-playbook/public/audio
          merge-multiple: true
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: open-playbook/dist

  deploy:
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Le site contient des milliers de clips audio : la copie vers Pages dépasse parfois les 10 min par défaut.
          timeout: 1800000
