# Open Playbook : valide les fiches, construit le site et le publie sur GitHub Pages.
# Activer une fois : Settings → Pages → Source : « GitHub Actions ».
name: Open Playbook

on:
  push:
    branches: [main]
    paths: ["open-playbook/**", ".github/workflows/open-playbook.yml"]
  pull_request:
    paths: ["open-playbook/**", ".github/workflows/open-playbook.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-playbook-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: open-playbook

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: open-playbook/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: open-playbook/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
