# Vérification automatique à chaque PR et à chaque mise à jour de main.
# Le dépôt n'a pas de package.json à la racine (un dossier = un site) : au lieu de `npm ci`,
# on vérifie la syntaxe de tous les scripts de tous les sites (JS, TypeScript des fonctions, JSON).
# Rien à installer, aucun frais (minutes GitHub Actions gratuites).

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  syntaxe:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - name: Vérifier la syntaxe des scripts (tous les sites)
      run: node .github/scripts/verifier-syntaxe.mjs .
